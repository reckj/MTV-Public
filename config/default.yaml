# MoniToni default configuration. Do not edit on a machine; put machine-specific
# values in config/local.yaml (see local.yaml.example). local.yaml is merged on
# top of this file key by key.

system:
  name: "MoniToni Vending Machine"
  machine_id: "VM001"
  maintenance_mode: false
  maintenance_message: "Machine under maintenance"

hardware:
  # real = talk to the modules below. Development always runs `python -m monitoni --mock`.
  mode: real

  # Waveshare 8-ch Modbus relay module (Module C): motor, spindle lock, digital inputs.
  relay_core:
    host: "192.168.1.100"
    port: 502
    slave_address: 1
    timeout: 1.0
    max_channels: 8

  # Waveshare 30-ch Modbus relay module: one door lock per level.
  relay_levels:
    host: "192.168.1.101"
    port: 502
    slave_address: 1
    timeout: 1.0
    max_channels: 30

  # Gledopto ESP32 running WLED, driven over ArtNet.
  wled:
    ip_address: "192.168.1.102"
    universe: 0
    fps: 30
    pixel_count: 300

  # Door sensor is a digital input on relay_core.
  door_sensor:
    di_index: 0
    poll_interval_ms: 150

  audio:
    volume: 0.7

web:
  host: "127.0.0.1"
  port: 8080

vending:
  levels: 10
  timings:
    sleep_timeout_s: 60
    purchase_timeout_s: 120
    door_unlock_timeout_s: 30
    door_alarm_delay_s: 10

purchase_server:
  base_url: "http://localhost:5000"   # override in local.yaml
  check_path: "/api/purchase/check"
  complete_path: "/api/purchase/complete"
  poll_interval_s: 0.5
  timeout_s: 5.0

qr:
  # QR for level N encodes base_url + "/" + machine_id + "/" + N
  base_url: "https://www.monitoni.zhdk.ch"
  dir: "data/qr"          # generated PNGs; relative paths are resolved from the repo root

database:
  path: "data/monitoni.db"   # relative paths are resolved from the repo root
